name: Intraday Poll for Market Dip Monitor

on:
  schedule:
    - cron: '*/15 13-23 * * 1-5'  # Every 15 min, 9:00 AM–7:59 PM ET (13:00–23:59 UTC), Mon–Fri
  workflow_dispatch:  # Allows manual triggering

jobs:
  intraday-poll:
    runs-on: ubuntu-latest

    env:
      PYTZ_TIMEZONE: America/New_York
      SMTP_USER: ${{ secrets.SMTP_USER }}
      SMTP_PASS: ${{ secrets.SMTP_PASS }}
      SMTP_SERVER: smtp.gmail.com
      SMTP_PORT: 465
      ALERT_TO: ${{ secrets.ALERT_TO }}
      ALERT_TRIGGERS: SMA20_GAP,BOLLINGER,RSI,VIX25,DD10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'  # Adjust to your Python version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas yfinance pytz

      - name: Run intraday poll
        run: python market_dip_monitor.py intraday

      - name: Upload logs
        uses: actions/upload-artifact@v4
        with:
          name: intraday-logs
          path: logs/
          if-no-files-found: warn
