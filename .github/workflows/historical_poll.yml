name: Historical Stock Monitor

on:
  workflow_dispatch:

jobs:
  historical-poll:
    runs-on: ubuntu-latest
    env:
      PYTZ_TIMEZONE: America/New_York

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run historical poll
      run: python market_dip_monitor_v2.py historical 2025-04-01 2025-04-24

    - name: Commit and push logs
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add logs/
        git commit -m "Update logs from historical poll" || echo "No changes to commit"
        git push
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload logs as artifact
      uses: actions/upload-artifact@v4
      with:
        name: historical-logs
        path: logs/
        retention-days: 7
